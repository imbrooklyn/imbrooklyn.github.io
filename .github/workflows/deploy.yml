name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          path: imbrooklyn.github.io

      - name: Checkout blog
        uses: actions/checkout@v7
        with:
          repository: imbrooklyn/blog
          path: blog

      - name: Checkout Understanding LLMs
        uses: actions/checkout@v7
        with:
          repository: imbrooklyn/understanding-llms
          path: understanding-llms

      - name: Record blog revision
        working-directory: blog
        run: git rev-parse HEAD

      - name: Record book revision
        working-directory: understanding-llms
        run: git rev-parse HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            imbrooklyn.github.io/pnpm-lock.yaml
            understanding-llms/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: imbrooklyn.github.io
        run: pnpm install --frozen-lockfile

      - name: Install book dependencies
        working-directory: understanding-llms
        run: pnpm install --frozen-lockfile

      - name: Validate and build website
        working-directory: imbrooklyn.github.io
        run: pnpm ci:build

      - name: Validate and build book
        working-directory: understanding-llms
        run: pnpm ci:build

      - name: Compose Pages artifact
        working-directory: imbrooklyn.github.io
        run: pnpm compose:site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: imbrooklyn.github.io/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
